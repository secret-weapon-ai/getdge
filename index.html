<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AI Readiness Reports</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1ea;
      --ink: #1b1916;
      --body: #3c3832;
      --muted: #6d675d;
      --line: #d9d2c5;
      --accent: #1d4a46;
      --panel: #fbf9f5;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.6;
    }

    main {
      flex: 1;
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 4.75rem 0 3rem;
    }

    .mark {
      margin: 0 0 1.5rem;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      font-size: clamp(2.35rem, 6vw, 3.4rem);
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.08;
    }

    .lede {
      max-width: 36rem;
      margin: 1.35rem 0 0;
      color: var(--body);
    }

    .reports-section {
      margin-top: 3.25rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .reports {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .reports:empty {
      display: none;
    }

    .reports li + li {
      border-top: 1px solid var(--line);
    }

    .reports a {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 0;
      color: inherit;
      text-decoration: none;
    }

    .reports a:hover,
    .reports a:focus-visible {
      color: var(--accent);
    }

    .reports .date {
      flex: none;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      margin: 0;
      padding: 1.2rem 1rem;
      border: 1px dashed var(--line);
      border-radius: 2px;
      background: var(--panel);
      color: var(--muted);
    }

    footer {
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 0 0 2rem;
      color: var(--muted);
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">getdge</p>
    <h1>AI Readiness Reports</h1>
    <p class="lede">Audit reports for car dealerships. Each one tests whether the store shows up when people ask AI assistants where to buy.</p>

    <section class="reports-section" aria-labelledby="reports-heading">
      <h2 id="reports-heading">Reports</h2>
      <!--
        Add one item per published report, then remove the empty-state paragraph:
        <li><a href="reports/<client-slug>/<yyyy-mm-dd>/">Dealership name <span class="date">YYYY-MM-DD</span></a></li>
      -->
      <ul class="reports">
      </ul>
      <p class="empty">No reports published yet.</p>
    </section>
  </main>
  <footer>
    <p>grow.getdge.co</p>
  </footer>
</body>
</html>
